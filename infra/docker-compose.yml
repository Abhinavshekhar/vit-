services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
      POSTGRES_DB: astraos
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes: ["../apps/api:/app"]
    command: bash -lc "pip install -e . && uvicorn astra_os.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://astra:astra@postgres:5432/astraos
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
volumes:
  postgres-data:
