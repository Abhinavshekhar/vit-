name: CI

on:
  pull_request:
  push:
    branches: [main, work]

jobs:
  api-tests:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run unit tests
        run: python -m pytest tests
      - name: Compile core modules
        run: |
          python -m py_compile \
            apps/api/astra_os/scheduler/engine.py \
            apps/api/astra_os/services/attendance.py \
            apps/api/astra_os/services/events.py \
            apps/api/astra_os/services/briefing.py

  web-metadata:
    name: Web metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package metadata JSON
        run: python -m json.tool apps/web/package.json >/tmp/package.json.check
      - name: Validate PWA manifest JSON
        run: python -m json.tool apps/web/public/manifest.json >/tmp/manifest.json.check
